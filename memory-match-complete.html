<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Worlds — Memory Match</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:38px 18px;color:#eef4ff;font:16px system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#344d8a,#121936 48%,#070a16)}header{text-align:center;margin-bottom:24px}.eyebrow{color:#abc1f1;font-size:12px;font-weight:800;letter-spacing:.3em}h1{margin:10px 0 6px;font:700 clamp(42px,7vw,76px) Georgia,serif;letter-spacing:-.04em}header p{margin:0;color:#b9c5e0}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto}.choice{border:1px solid #7189c3;border-radius:999px;padding:10px 17px;color:#d5e0fa;background:#172249dd;font-weight:700;cursor:pointer}.choice.active,.choice:hover{color:#162342;background:#d9f3ff}.status{text-align:center;min-height:24px;margin:15px;color:#ffd98c;font-weight:700}.board{display:grid;grid-template-columns:repeat(6,minmax(75px,145px));justify-content:center;gap:16px;max-width:1050px;margin:auto}.board.level-one{grid-template-columns:repeat(3,minmax(105px,180px));max-width:620px}.card{position:relative;width:100%;aspect-ratio:744/1039;padding:0;border:5px solid #c7d8ff;border-radius:18px;overflow:hidden;cursor:pointer;background:radial-gradient(circle at center,#5275bb 1px,transparent 2px) 0 0/18px 18px,linear-gradient(135deg,#17234f,#111936 55%,#385693);box-shadow:0 14px 28px #0006;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-6px);box-shadow:0 20px 34px #0008}.card:before{content:'✦';position:absolute;inset:25%;display:grid;place-items:center;border:3px solid #a9c7ff;border-radius:50%;color:#e8f3ff;font-size:clamp(32px,6vw,60px);box-shadow:0 0 25px #8dbdff88,inset 0 0 18px #8dbdff44}.card img{display:none;width:100%;height:100%;object-fit:cover}.card.open img,.card.matched img{display:block}.card.open:before,.card.matched:before{display:none}.card.matched{box-shadow:0 0 22px #9fe7c7aa,0 14px 28px #0006}.success{position:fixed;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;font:800 clamp(48px,11vw,120px) Georgia,serif;color:#e0ffef;text-shadow:0 0 28px #49e19b}.success.show{animation:pop .9s ease both}@keyframes pop{25%,75%{opacity:1;transform:scale(1)}0{transform:scale(.7)}100%{opacity:0;transform:scale(1.08)}}.win{display:none;position:fixed;z-index:8;inset:0;place-items:center;background:#080d20ee;color:#fff;font:700 clamp(44px,10vw,120px) Georgia,serif;text-shadow:0 0 25px #9cc8ff}.win.show{display:grid}.win button{position:absolute;bottom:9%;border:0;border-radius:999px;padding:14px 25px;color:#162342;background:#d9f3ff;font-weight:800;cursor:pointer}@media(max-width:700px){.board{grid-template-columns:repeat(3,minmax(75px,130px));gap:10px}.board.level-one{grid-template-columns:repeat(3,minmax(80px,130px))}}</style></head><body><header><div class="eyebrow">SPACE WORLDS · MEMORY MATCH</div><h1>Memory Match</h1><p>Choose a level and challenge mode.</p></header><div class="controls" id="levels"><button class="choice active" data-pairs="3">Level 1 · 3 pairs</button><button class="choice" data-pairs="6">Level 2 · 6 pairs</button><button class="choice" data-pairs="9">Level 3 · 9 pairs</button></div><div class="controls" id="modes"><button class="choice active" data-mode="classic">Classic</button><button class="choice" data-mode="timed">Time Attack</button><button class="choice" data-mode="limited">Limited Moves</button></div><p class="status" id="status"></p><main class="board level-one" id="board"></main><div class="success" id="success">success!</div><div class="win" id="win">CONGRATULATIONS<button id="again">Play again</button></div><script>const worlds=[['aurelia','desert-planet-card.svg'],['cryon','ice-planet-card.svg'],['verdantia','jungle-planet-card.svg'],['aurum','golden-planet-card.svg'],['gravix','rocky-planet-card.svg'],['pyra','lava-planet-card.svg'],['stellara','star-planet-card.svg'],['pelagia','water-planet-card.svg'],['cupria','copper-planet-card.svg']],board=document.getElementById('board'),status=document.getElementById('status'),success=document.getElementById('success'),win=document.getElementById('win'),again=document.getElementById('again');let pairCount=3,mode='classic',open=[],locked=false,moves=0,seconds=60,timer=null;function reset(){clearInterval(timer);open=[];locked=false;moves=0;seconds=60;win.classList.remove('show');board.innerHTML='';board.className='board '+(pairCount===3?'level-one':'');worlds.slice(0,pairCount).flatMap(w=>[w,w]).sort(()=>Math.random()-.5).forEach(w=>{const c=document.createElement('button');c.className='card';c.dataset.id=w[0];c.innerHTML='<img src="./'+w[1]+'" alt="'+w[0]+' planet card">';c.onclick=()=>flip(c);board.appendChild(c)});update();if(mode==='timed')timer=setInterval(()=>{seconds--;update();if(seconds<=0){clearInterval(timer);locked=true;status.textContent='Time is up — choose a mode to try again'}},1000)}function update(){status.textContent=mode==='timed'?'Time Attack · '+seconds+' seconds left':mode==='limited'?'Limited Moves · '+(8-moves)+' moves left':'Classic · '+pairCount+' pairs'}function flip(c){if(locked||c.classList.contains('open')||c.classList.contains('matched'))return;c.classList.add('open');open.push(c);if(open.length<2)return;locked=true;moves++;update();if(open[0].dataset.id===open[1].dataset.id){open.forEach(x=>x.classList.add('matched'));open=[];locked=false;success.classList.add('show');setTimeout(()=>success.classList.remove('show'),700);if(document.querySelectorAll('.matched').length===pairCount*2)setTimeout(()=>{clearInterval(timer);win.classList.add('show')},700)}else setTimeout(()=>{open.forEach(x=>x.classList.remove('open'));open=[];locked=mode==='limited'&&moves>=8;if(locked)status.textContent='No moves left — choose a mode to try again'},800)}document.querySelectorAll('#levels .choice').forEach(b=>b.onclick=()=>{document.querySelector('#levels .active').classList.remove('active');b.classList.add('active');pairCount=+b.dataset.pairs;reset()});document.querySelectorAll('#modes .choice').forEach(b=>b.onclick=()=>{document.querySelector('#modes .active').classList.remove('active');b.classList.add('active');mode=b.dataset.mode;reset()});again.onclick=reset;reset();</script></body></html>
