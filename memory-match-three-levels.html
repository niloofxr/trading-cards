<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Worlds Memory Match</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:34px 18px;font-family:system-ui,sans-serif;color:#eef4ff;background:radial-gradient(circle at 50% -10%,#30477f,#101632 50%,#070a16)}header{text-align:center;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.3em;color:#abc1f1}h1{margin:10px 0 6px;font:700 clamp(38px,7vw,70px) Georgia,serif}p{margin:0;color:#bbc7e1}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px auto}.choice{border:1px solid #667fba;border-radius:999px;padding:9px 15px;background:#172249cc;color:#cbd8f4;font-weight:700;cursor:pointer}.choice.active,.choice:hover{background:#d9f3ff;color:#162342}.status{text-align:center;min-height:24px;margin:12px;color:#ffd98c;font-weight:700}.board{display:grid;grid-template-columns:repeat(6,minmax(75px,145px));justify-content:center;gap:14px;max-width:1050px;margin:auto}.board.level-one{grid-template-columns:repeat(3,minmax(100px,180px));max-width:620px}.card{position:relative;width:100%;aspect-ratio:744/1039;border:4px solid #c7d8ff;border-radius:15px;overflow:hidden;background:radial-gradient(circle at center,#5275bb 1px,transparent 2px) 0 0/18px 18px,linear-gradient(135deg,#17234f,#111936 55%,#385693);cursor:pointer;padding:0}.card:before{content:'✦';position:absolute;inset:25%;display:grid;place-items:center;border:2px solid #a9c7ff;border-radius:50%;color:#e8f3ff;font-size:35px}.card img{display:none;width:100%;height:100%;object-fit:cover}.card.open img,.card.matched img{display:block}.card.open:before,.card.matched:before{display:none}.success{position:fixed;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;font:800 clamp(48px,11vw,120px) Georgia,serif;color:#e0ffef;text-shadow:0 0 28px #49e19b}.success.show{animation:pop .9s ease both}@keyframes pop{25%,75%{opacity:1;transform:scale(1)}0{transform:scale(.7)}100%{opacity:0;transform:scale(1.08)}}
</style></head><body><header><div class="eyebrow">SPACE WORLDS · MEMORY MATCH</div><h1>Memory Match</h1><p>Choose a level and find every planet pair.</p></header><div class="controls" id="levels"><button class="choice active" data-pairs="3">Level 1 · 3 pairs</button><button class="choice" data-pairs="6">Level 2 · 6 pairs</button><button class="choice" data-pairs="9">Level 3 · 9 pairs</button></div><div class="controls" id="modes"><button class="choice active">Classic</button><button class="choice">Time Attack</button><button class="choice">Limited Moves</button></div><div class="status" id="status"></div><main class="board level-one" id="board"></main><div class="success" id="success">success!</div><script>
const worlds=[['aurelia','./desert-planet-card.svg'],['cryon','./ice-planet-card.svg'],['verdantia','./jungle-planet-card.svg'],['aurum','./golden-planet-card.svg'],['gravix','./rocky-planet-card.svg'],['pyra','./lava-planet-card.svg'],['stellara','./star-planet-card.svg'],['pelagia','./water-planet-card.svg'],['cupria','./copper-planet-card.svg']];const board=document.querySelector('#board'),status=document.querySelector('#status');let pairs=3,open=[],locked=false;function reset(){open=[];locked=false;board.innerHTML='';board.className='board '+(pairs===3?'level-one':'');worlds.slice(0,pairs).flatMap(w=>[w,w]).sort(()=>Math.random()-.5).forEach(([id,img])=>{const c=document.createElement('button');c.className='card';c.dataset.id=id;c.innerHTML=`<img src="${img}" alt="${id} planet card">`;c.onclick=()=>flip(c);board.appendChild(c)});status.textContent=`${pairs===3?'Level 1':pairs===6?'Level 2':'Level 3'} · ${pairs} pairs`}function flip(c){if(locked||c.classList.contains('open')||c.classList.contains('matched'))return;c.classList.add('open');open.push(c);if(open.length<2)return;locked=true;if(open[0].dataset.id===open[1].dataset.id){open.forEach(x=>x.classList.add('matched'));open=[];locked=false}else setTimeout(()=>{open.forEach(x=>x.classList.remove('open'));open=[];locked=false},800)}document.querySelectorAll('#levels .choice').forEach(b=>b.onclick=()=>{document.querySelector('#levels .active').classList.remove('active');b.classList.add('active');pairs=+b.dataset.pairs;reset()});reset();
</script></body></html>
