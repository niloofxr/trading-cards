  <text x="63" y="133" font-family="Arial,sans-serif" font-size="17" letter-spacing="5" fill="#865c0b">ELECTRIC FRIEND • 025</text>
  <circle cx="668" cy="89" r="42" fill="#d99016" stroke="#fff3a0" stroke-width="5"/>
