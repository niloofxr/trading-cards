    <ellipse cx="101" cy="176" rx="21" ry="26" fill="#29221e"/><ellipse cx="219" cy="176" rx="21" ry="26" fill="#29221e"/>
    <circle cx="94" cy="169" r="6" fill="#fff"/><circle cx="212" cy="169" r="6" fill="#fff"/>
