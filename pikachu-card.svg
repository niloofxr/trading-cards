  <text x="92" y="642" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" opacity=".9">THUNDERBOLT • STATIC CHARM</text>

  <rect x="56" y="710" width="632" height="196" rx="18" fill="#fff8dc" stroke="#b3780d" stroke-width="4"/>
  <g font-family="Arial,sans-serif" font-weight="700" fill="#25252a">
