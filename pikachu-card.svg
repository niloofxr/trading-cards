    <path d="M245 30l62-102q11-18-9-24l-101 41z" fill="#f7c928" stroke="#28211b" stroke-width="11" stroke-linejoin="round"/>
    <path d="M22-73l42 17-37 31q-12-22-5-48zm256-7l-40 18 37 29q11-24 3-47z" fill="#27211e"/>
