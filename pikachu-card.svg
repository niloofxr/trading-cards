  <path d="M240 732v139M240 780h370M240 838h370" stroke="#e9ce83" stroke-width="3"/>
  <text x="62" y="958" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#3b3427">A bright spark of courage that turns every challenge</text>
  <text x="62" y="987" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#3b3427">into an adventure worth smiling about.</text>
