<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 1039" role="img" aria-labelledby="title desc">
  <title id="title">Pikachu trading card</title>
  <desc id="desc">A golden framed trading card featuring Pikachu, with Power, Speed, and Creativity stats.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff4bd"/><stop offset="1" stop-color="#f6b928"/></linearGradient>
    <linearGradient id="art" x2="1" y2="1"><stop stop-color="#83d7e5"/><stop offset="1" stop-color="#227ca1"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
    <pattern id="sparkle" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M35 8l4 23 23 4-23 4-4 23-4-23-23-4 23-4z" fill="#fff" opacity=".24"/></pattern>
  </defs>
  <rect x="10" y="10" width="724" height="1019" rx="48" fill="#161b25" filter="url(#shadow)"/>
  <rect x="24" y="24" width="696" height="991" rx="38" fill="url(#bg)" stroke="#f9df72" stroke-width="7"/>
  <path d="M39 149h666v11H39z" fill="#b3780d" opacity=".7"/>
