<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Worlds — Memory Match</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 24px 72px; color: #eef4ff; font-family: system-ui, sans-serif; background: radial-gradient(circle at 50% -10%, #30477f, #101632 50%, #070a16); }
    header { margin: 0 auto 42px; max-width: 1100px; text-align: center; }
    .eyebrow { color: #abc1f1; font-size: 12px; font-weight: 800; letter-spacing: .3em; }
    h1 { margin: 12px 0 8px; font: 700 clamp(42px, 7vw, 72px)/1 Georgia, serif; }
    p { margin: 0; color: #bbc7e1; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(160px, 250px)); gap: 28px; justify-content: center; max-width: 1100px; margin: auto; }
    .card { position: relative; width: 100%; aspect-ratio: 744 / 1039; border: 5px solid #c7d8ff; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at center, #5275bb 1px, transparent 2px) 0 0 / 22px 22px, linear-gradient(135deg, #17234f, #111936 55%, #385693); box-shadow: 0 14px 30px #0006; transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; padding: 0; }
    .card:hover { transform: translateY(-7px); box-shadow: 0 22px 38px #0008; }
    .card::before { content: "✦"; position: absolute; inset: 25%; display: grid; place-items: center; border: 3px solid #a9c7ff; border-radius: 50%; color: #e8f3ff; font-size: clamp(34px, 7vw, 70px); box-shadow: 0 0 25px #8dbdff88, inset 0 0 18px #8dbdff44; }
    .card img { display: none; width: 100%; height: 100%; object-fit: cover; }
    .card.flipped img, .card.matched img { display: block; }
    .card.flipped::before, .card.matched::before { display: none; }
    .card.matched { cursor: default; box-shadow: 0 0 22px #9fe7c7aa, 0 14px 30px #0006; }
    .card:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .levels { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: -20px auto 28px; }
    .level { border: 1px solid #667fba; border-radius: 999px; padding: 9px 16px; color: #cbd8f4; background: #172249cc; font-weight: 700; cursor: pointer; }
    .level.active, .level:hover { color: #162342; background: #d9f3ff; }
    .status { min-height: 22px; margin: -14px auto 22px; text-align: center; color: #ffd98c; font-weight: 700; }
    .success { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transform: scale(.7); color: #e0ffef; font: 800 clamp(48px, 11vw, 120px)/1 Georgia, serif; text-shadow: 0 0 28px #49e19b, 0 6px #132d50; }
    .success.show { animation: success .9s ease both; }
    @keyframes success { 0% { opacity: 0; transform: scale(.7); } 25%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
    .win { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; visibility: hidden; opacity: 0; background: #060a18dd; transition: opacity .45s ease; }
    .win.show { visibility: visible; opacity: 1; }
    .win-title { position: relative; z-index: 3; text-align: center; color: #fff; font: 700 clamp(44px, 10vw, 128px)/.9 Georgia, serif; letter-spacing: -.06em; text-shadow: 0 0 26px #9cc8ff, 0 8px #213769; }
    .win-title small { display: block; margin-top: 22px; color: #c7d7ff; font: 700 14px system-ui, sans-serif; letter-spacing: .25em; }
    .play-again { position: absolute; z-index: 4; bottom: 8%; left: 50%; transform: translateX(-50%); border: 0; border-radius: 999px; padding: 14px 25px; color: #162342; background: #d9f3ff; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px #0006; }
    .play-again:hover { background: #fff; transform: translateX(-50%) translateY(-2px); }
    .stack { position: absolute; z-index: 2; left: 50%; top: 50%; width: min(28vw, 190px); aspect-ratio: 744 / 1039; transform: translate(-50%, -50%); }
    .stack img { position: absolute; width: 100%; border: 3px solid #fff; border-radius: 18px; box-shadow: 0 14px 30px #0009; }
    .stack img:nth-child(1) { transform: rotate(-12deg) translate(-12px, 7px); }
    .stack img:nth-child(2) { transform: rotate(7deg) translate(13px, -5px); }
    .stack img:nth-child(3) { transform: rotate(-1deg); }
    .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .confetti i { position: absolute; top: -12%; width: 9px; height: 18px; background: var(--c); animation: fall var(--d) linear infinite; animation-delay: var(--delay); transform: rotate(var(--r)); }
    @keyframes fall { to { top: 110%; transform: translateX(var(--x)) rotate(720deg); } }
    @media (max-width: 700px) { .cards { grid-template-columns: repeat(2, minmax(135px, 220px)); gap: 18px; } body { padding: 32px 14px 48px; } }
  </style>
</head>
<body>
  <header><div class="eyebrow">SPACE WORLDS · MEMORY MATCH</div><h1>Memory Match</h1><p>Find the matching pairs across the galaxy.</p></header>
  <nav class="levels" aria-label="Challenge levels"><button class="level active" data-level="classic">Classic</button><button class="level" data-level="timed">Time Attack</button><button class="level" data-level="limited">Limited Moves</button></nav>
  <div class="status" id="status" aria-live="polite">Classic level</div>
  <main class="cards" aria-label="Six Space Worlds cards">
    <button class="card" data-world="aurelia"><img src="./desert-planet-card.svg" alt="Aurelia desert planet card"></button>
    <button class="card" data-world="aurelia"><img src="./desert-planet-card.svg" alt="Aurelia desert planet card"></button>
    <button class="card" data-world="cryon"><img src="./ice-planet-card.svg" alt="Cryon ice planet card"></button>
    <button class="card" data-world="cryon"><img src="./ice-planet-card.svg" alt="Cryon ice planet card"></button>
    <button class="card" data-world="verdantia"><img src="./jungle-planet-card.svg" alt="Verdantia jungle planet card"></button>
    <button class="card" data-world="verdantia"><img src="./jungle-planet-card.svg" alt="Verdantia jungle planet card"></button>
  </main>
  <div class="success" id="success" aria-live="polite">success!</div>
  <div class="win" id="win" role="dialog" aria-modal="true" aria-label="You won">
    <div class="confetti" id="confetti"></div>
    <div class="stack"><img src="./desert-planet-card.svg" alt=""><img src="./ice-planet-card.svg" alt=""><img src="./jungle-planet-card.svg" alt=""></div>
    <div class="win-title">CONGRATULATIONS<small>YOU FOUND EVERY PAIR</small></div>
    <button class="play-again" id="playAgain">Play again</button>
  </div>
  <script>
    const cards = [...document.querySelectorAll('.card')];
    const success = document.querySelector('#success');
    const win = document.querySelector('#win');
    const confetti = document.querySelector('#confetti');
    const board = document.querySelector('.cards');
    const status = document.querySelector('#status');
    const colors = ['#ffd166', '#7be0c3', '#9cc8ff', '#ff8fab', '#fff'];
    let level = 'classic', timer = null, seconds = 60, moves = 0;
    function showWin() {
      clearInterval(timer);
      confetti.innerHTML = '';
      for (let i = 0; i < 90; i++) {
        const bit = document.createElement('i');
        bit.style.cssText = `left:${Math.random() * 100}%;--c:${colors[i % colors.length]};--d:${3 + Math.random() * 4}s;--delay:${Math.random() * 2}s;--x:${(Math.random() - .5) * 180}px;--r:${Math.random() * 360}deg`;
        confetti.appendChild(bit);
      }
      win.classList.add('show');
    }
    function shuffleCards() {
      const shuffled = [...cards].sort(() => Math.random() - .5);
      shuffled.forEach(card => {
        card.classList.remove('flipped', 'matched');
        board.appendChild(card);
      });
      open = []; locked = false;
      clearInterval(timer); seconds = 60; moves = 0;
      status.textContent = level === 'timed' ? 'Time Attack · 60 seconds' : level === 'limited' ? 'Limited Moves · 8 moves left' : 'Classic level';
      if (level === 'timed') timer = setInterval(() => {
        seconds--; status.textContent = `Time Attack · ${seconds} seconds left`;
        if (seconds <= 0) { clearInterval(timer); locked = true; status.textContent = 'Time is up — choose a level to try again'; }
      }, 1000);
    }
    document.querySelector('#playAgain').addEventListener('click', () => {
      win.classList.remove('show');
      shuffleCards();
    });
    document.querySelectorAll('.level').forEach(button => button.addEventListener('click', () => {
      document.querySelector('.level.active').classList.remove('active'); button.classList.add('active');
      level = button.dataset.level; win.classList.remove('show'); shuffleCards();
    }));
    let open = [], locked = false;
    cards.forEach(card => card.addEventListener('click', () => {
      if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped'); open.push(card);
      if (open.length !== 2) return;
      moves++; locked = true;
      if (level === 'limited') status.textContent = `Limited Moves · ${8 - moves} moves left`;
      if (open[0].dataset.world === open[1].dataset.world) {
        open.forEach(item => item.classList.add('matched'));
        success.classList.remove('show');
        void success.offsetWidth;
        success.classList.add('show');
        open = []; locked = false;
        if (cards.filter(item => item.classList.contains('matched')).length === cards.length) setTimeout(showWin, 700);
      } else {
        setTimeout(() => {
          open.forEach(item => item.classList.remove('flipped')); open = [];
          if (level === 'limited' && moves >= 8) { locked = true; status.textContent = 'No moves left — choose a level to try again'; }
          else locked = false;
        }, 850);
      }
    }));
  </script>
</body>
</html>
